let state={mode:'learn',case:null,step:0,scores:{safety:0,communication:0,reasoning:0,routing:0,professional:0},history:[],selected:null,reflections:{},started:false};
function clamp(n){return Math.max(0,Math.min(100,n))}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){try{localStorage.setItem('dus_klinik_pusula_v1',JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem('dus_klinik_pusula_v1'));if(x&&x.mode)state={...state,...x}}catch(e){}}
function reset(all=false){const mode=state.mode;state={mode:all?'learn':mode,case:null,step:0,scores:{safety:0,communication:0,reasoning:0,routing:0,professional:0},history:[],selected:null,reflections:{},started:false};save();render()}
function home(){state.case=null;state.step=0;state.selected=null;save();render()}
function start(k){state.case=k;state.step=0;state.scores={safety:0,communication:0,reasoning:0,routing:0,professional:0};state.history=[];state.selected=null;state.reflections={};state.started=true;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function setMode(m){state.mode=m;save();render()}
function choose(i){if(state.selected!==null)return;const st=STEPS[state.case][state.step],o=st.opts[i];state.selected=i;Object.entries(o.p||{}).forEach(([k,v])=>state.scores[k]=(state.scores[k]||0)+v);state.history.push({step:st.title,choice:o.t,grade:o.grade,skill:o.skill});save();render();setTimeout(()=>document.getElementById('feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function next(){state.step++;state.selected=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function previous(){if(state.step===0)return;state.step--;state.selected=null;state.history.pop();state.scores={safety:0,communication:0,reasoning:0,routing:0,professional:0};state.history.forEach((h,idx)=>{const st=STEPS[state.case][idx];const o=st.opts.find(x=>x.t===h.choice);Object.entries((o&&o.p)||{}).forEach(([k,v])=>state.scores[k]+=v)});save();render()}
function maxScore(dim){let n=0;STEPS[state.case].forEach(st=>{let best=Math.max(...st.opts.map(o=>(o.p&&o.p[dim])||0));n+=Math.max(0,best)});return Math.max(1,n)}
function pct(dim){return clamp(Math.round((Math.max(0,state.scores[dim])/maxScore(dim))*100))}
function gradeText(g){return g==='good'?'Güçlü yaklaşım':g==='ok'?'Savunulabilir ama geliştirilebilir':'Riskli yaklaşım'}
function gradeClass(g){return g==='good'?'':' '+(g==='ok'?'ok':'risk')}
function landing(){return `<section class="hero"><div class="eyebrow">İntörn diş hekimliği · otantik klinik prova</div><h1>Klinik Pusula</h1><p class="lead">İlk karşılaşmada hastayı dinleme, güvenli öykü alma, belirsizliği açıklama ve doğru kliniğe/üst değerlendirmeye yönlendirme. Tek doğru cümle oyunu değildir: bazı adımlarda iki farklı yaklaşım aynı ölçüde savunulabilir.</p><div class="chips"><span class="chip">Hasta karşılama</span><span class="chip">Klinik akıl yürütme</span><span class="chip">Yönlendirme</span><span class="chip">YZ çıktısını eleştirme</span><span class="chip">Öz değerlendirme</span></div><div class="modebar"><div><strong>Çalışma modu</strong><div class="mini">Öğrenme: gerekçe anında · Sınama: gerekçe sonda</div></div><div class="modebuttons"><button class="btn ${state.mode==='learn'?'active':''}" onclick="setMode('learn')">Öğrenme</button><button class="btn ${state.mode==='test'?'active':''}" onclick="setMode('test')">Sınama</button></div></div></section><section class="grid">${Object.entries(CASES).map(([k,c])=>`<button class="card case" onclick="start('${k}')"><span class="tag ${c.tagClass}">${c.tag}</span><h2>${c.name} · ${c.age}</h2><strong>${c.title}</strong><p>${c.intro}</p><div class="mini" style="margin-top:13px"><b>Odak:</b> ${c.focus}</div></button>`).join('')}</section><section class="source"><strong>Pedagojik yapı</strong><div class="mini">Bu modül, 2026 Australian Dental Journal derlemesindeki otantik değerlendirme, süreç değerlendirmesi, simüle hasta, Miller piramidinin üst basamaklarını öne çıkarma ve YZ kullanımında bağımsız klinik muhakemeyi koruma ilkelerinden yararlanır. Senaryolar özgün/sentetiktir; makalenin klinik vaka içerikleri değildir.</div></section>`}
function side(step,total){return `<aside class="side"><div class="card sidecard"><div class="stepcount">${state.step+1} / ${total}</div><div class="progress"><span style="width:${((state.step+1)/total)*100}%"></span></div><strong>Gelişim göstergeleri</strong>${Object.keys(DIMS).map(k=>`<div class="metric"><div class="metricline"><span>${DIMS[k]}</span><b>${pct(k)}%</b></div><div class="meter"><span style="width:${pct(k)}%"></span></div></div>`).join('')}<div class="history"><strong class="mini">Karar izi</strong>${state.history.length?state.history.map(h=>`<div>${esc(h.step)} · ${esc(h.skill)}</div>`).join(''):'<div>Henüz seçim yok.</div>'}</div></div></aside>`}
function scenario(){const c=CASES[state.case],steps=STEPS[state.case],st=steps[state.step];if(!st)return finish();return `<section class="scenario"><div class="card maincard"><div class="scenehead"><div><span class="tag ${c.tagClass}">${c.tag}</span><h2>${c.name} · ${st.title}</h2></div>${st.ai?'<span class="aiLabel">◆ YZ kontrol noktası</span>':''}</div>${st.ai?`<div class="aiBox"><strong>Önce kendi kararınız, sonra YZ</strong><div class="mini">Bu kart çevrimiçi yapay zekâ değildir. Öğrencinin ilk kararını verdikten sonra bir YZ çıktısının güvenilirliğini tartması için sabit olarak yazılmıştır.</div></div>`:''}<div class="patient"><div class="who">${st.ai?'Eğitim kartı':c.name+' söylüyor'}</div><q>${st.patient}</q><div class="behavior">${st.behavior}</div></div><div class="prompt">${st.prompt}</div><div class="options">${st.opts.map((o,i)=>`<button class="option ${state.selected===i?'selected':''}" onclick="choose(${i})" ${state.selected!==null?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`).join('')}</div>${state.selected!==null?feedback(st):''}<div class="nextrow"><button class="btn ghost" onclick="previous()" ${state.step===0?'disabled':''}>← Önceki</button><button class="btn" onclick="home()">Vakalar</button>${state.selected!==null?`<button class="btn primary" onclick="next()">${state.step===steps.length-1?'Değerlendirmeye geç':'Devam →'}</button>`:''}</div></div>${side(st,steps.length)}</section>`}
function feedback(st){const o=st.opts[state.selected];if(state.mode==='test' && o.grade!=='risk')return `<div id="feedback" class="feedback"><strong>Seçiminiz kaydedildi.</strong><div class="mini">Sınama modunda ayrıntılı gerekçe görüşme sonunda açılır. Güvenliği doğrudan etkileyen riskli seçimler ise anında görünür.</div></div>`;return `<div id="feedback" class="feedback${gradeClass(o.grade)}"><strong>${gradeText(o.grade)} · ${o.skill}</strong><div class="reaction"><b>Hasta/akış etkisi:</b> ${o.reaction}</div><div class="why"><b>Ne işe yarar / neden önemli?</b> ${o.why}</div><details class="alts"><summary>Diğer seçeneklerin mantığını gör</summary><ul>${st.opts.map((x,i)=>i===state.selected?'':`<li><b>${gradeText(x.grade)}:</b> ${x.why}</li>`).join('')}</ul></details></div>`}
function finish(){const c=CASES[state.case];const strengths=Object.keys(DIMS).filter(k=>pct(k)>=70).map(k=>DIMS[k]);const needs=Object.keys(DIMS).filter(k=>pct(k)<55).map(k=>DIMS[k]);const avg=Math.round(Object.keys(DIMS).reduce((a,k)=>a+pct(k),0)/Object.keys(DIMS).length);const hist=state.history.map((h,i)=>`${i+1}. ${h.step}: ${h.skill} — ${gradeText(h.grade)}`).join('\n');return `<section class="card maincard"><span class="tag">Görüşme sonu</span><h1 style="font-size:2.3rem">${c.name} · klinik gelişim özeti</h1><p class="lead">Bu sonuç, “doğru cevabı buldunuz mu?”dan çok karar sürecinizin hangi yönlerinin güçlü olduğunu gösterir.</p><div class="resultGrid"><div class="result"><span>Genel gelişim göstergesi</span><b>${avg}%</b><small>Formative / eğitim amaçlı</small></div><div class="result"><span>Güçlü alanlar</span><b style="font-size:1.08rem">${strengths.length?strengths.join(', '):'Henüz belirgin değil'}</b></div><div class="result"><span>Tekrar gerektiren alanlar</span><b style="font-size:1.08rem">${needs.length?needs.join(', '):'Belirgin eksik yok'}</b></div></div><h2>Kısa öz değerlendirme</h2><label><b>Bu vakada kararınızı en çok değiştiren hasta bilgisi neydi?</b></label><textarea class="reflect" id="r1" oninput="state.reflections.r1=this.value;save()">${esc(state.reflections.r1||'')}</textarea><br><br><label><b>Sorumlu hekime 20 saniyelik devir yapacak olsanız ne söylerdiniz?</b></label><textarea class="reflect" id="r2" oninput="state.reflections.r2=this.value;save()">${esc(state.reflections.r2||'')}</textarea><br><br><label><b>YZ önerisinde hangi noktayı özellikle doğrulamak gerekti?</b></label><textarea class="reflect" id="r3" oninput="state.reflections.r3=this.value;save()">${esc(state.reflections.r3||'')}</textarea><div class="route"><b>Miller piramidi açısından:</b> Bu HTML, “knows how”dan “shows how”a geçişi destekleyen düşük riskli bir simülasyondur. Gerçek hastada gözlenen iletişim, muayene, psikomotor beceri ve sorumlu klinisyen geri bildirimi olmadan “does” düzeyindeki klinik yetkinliği kanıtlamaz.</div><h2 style="margin-top:22px">Karar izi</h2><div class="report">${esc(hist)}</div>${state.mode==='test'?`<h2 style="margin-top:22px">Sınama modu geri bildirimi</h2><div class="report">${state.history.map((h,i)=>{const st=STEPS[state.case][i],o=st.opts.find(x=>x.t===h.choice);return `${i+1}. ${h.step}\n${gradeText(h.grade)} · ${h.skill}\n${o?o.why:''}`}).join('\n\n')}</div>`:''}<div class="source"><strong>Kaynağın bu modüle katkısı</strong><div class="mini">Ahmed & Burrow (Australian Dental Journal, 2026) simüle hasta etkileşimlerini düşük riskli klinik akıl yürütme pratiği için yararlı görür; ancak gerçek hasta bakımının yerini alamayacağını vurgular. Derleme ayrıca süreç odaklı ve bağlama özgü otantik değerlendirmeyi, Miller piramidinin “shows how/does” düzeylerini, YZ çıktılarının kritik doğrulanmasını ve öğrencinin YZ kullanmadan da temel yetkinlikleri gösterebilmesini öne çıkarır.</div></div><div class="nextrow"><button class="btn" onclick="start('${state.case}')">Vakayı yeniden dene</button><button class="btn" onclick="home()">Başka vaka</button><a class="btn primary" href="../../">Tüm modüller</a></div></section>`}
function render(){document.getElementById('app').innerHTML=state.case?scenario():landing()}
load();render();
</script>
