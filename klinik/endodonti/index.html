<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Klinik İlk Karşılaşma | Endodonti</title><style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#173b3a;--text:#294243;--muted:#6a7b7c;--line:#dbe5df;--teal:#0a7f77;--soft:#eaf4ef;--warn:#fff5e6;--bad:#fff0ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;color:var(--ink)}.back{color:var(--teal);text-decoration:none;font-weight:700}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 36px rgba(20,55,54,.06)}.hero{padding:30px;margin-bottom:22px}.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--teal)}h1,h2,h3{color:var(--ink);line-height:1.2}h1{font-size:clamp(2rem,6vw,3.6rem);margin:.3rem 0 1rem}.lead{color:var(--muted);max-width:760px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{padding:24px}.case{cursor:pointer;text-align:left;width:100%;transition:.15s}.case:hover{transform:translateY(-2px)}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);font-size:.76rem;font-weight:800;color:var(--teal)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.scene{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.patient{background:var(--soft);padding:18px;border-radius:16px;margin:14px 0}.patient strong{display:block;color:var(--teal);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.patient q{font-size:1.12rem;color:var(--ink)}.body{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:8px}.options{display:grid;gap:10px;margin-top:16px}.option{display:flex;gap:12px;text-align:left;width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}.option:hover{border-color:#9dc7bb;background:#f7fbf8}.letter{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:8px;background:#eef2ef;font-weight:800;color:var(--muted)}.feedback{margin-top:16px;padding:18px;border-radius:14px;background:var(--soft);border:1px solid #bfd9ce}.feedback.warn{background:var(--warn);border-color:#e8cfaa}.feedback.bad{background:var(--bad);border-color:#e8bdb9}.side{position:sticky;top:16px}.meter{height:8px;background:#e8eeea;border-radius:9px;overflow:hidden;margin:6px 0 14px}.meter span{display:block;height:100%;background:var(--teal)}.small{font-size:.86rem;color:var(--muted)}.history{display:grid;gap:8px;margin-top:12px}.history div{padding:9px 10px;border-radius:10px;background:#f7f8f6;font-size:.82rem}.done{margin-top:14px;padding:12px;border-left:4px solid var(--teal);background:#f7fbf8}.report{white-space:pre-wrap;background:#f7f8f6;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.hide{display:none}.mode{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.mode button.active{background:var(--ink);color:white}.footer{margin-top:28px;font-size:.82rem;color:var(--muted)}@media(max-width:800px){.scene{grid-template-columns:1fr}.side{position:static}.wrap{padding:16px}.hero,.card{padding:20px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">DUS · Klinik Prova</div><a class="back" href="../../">← Modüller</a></div><div id="app"></div><div class="footer">Eğitim amaçlı simülasyondur; gerçek hasta değerlendirmesinin yerini tutmaz.</div></main><script>
const CASES={ece:{name:'Ece',title:'Ağrı + iğne kaygısı',intro:'24 yaşında, alt sağ bölgede iki gündür artan ağrı nedeniyle geliyor. Kapıda biraz gergin; önceki diş tedavisinde iğneden kötü etkilenmiş.',facts:{complaint:'Sağ alt arka bölgede 2 gündür artan ağrı',pain:'Soğukta artıyor, gece uyandırıyor; ağrı kesiciyle kısmen azalıyor',meds:'Düzenli ilaç kullanmıyor; bugün parasetamol aldı',allergy:'Bilinen ilaç ve lateks alerjisi olmadığını söylüyor',history:'Önemli sistemik hastalık öyküsü yok',fear:'Önceki enjeksiyonda çok korkmuş; kontrolünü kaybetmekten çekiniyor',expect:'Ağrının bugün azalmasını istiyor; antibiyotik gerekip gerekmediğini soruyor'}},murat:{name:'Murat',title:'Şişlik + işe dönme baskısı',intro:'38 yaşında, yüzün sol alt tarafında belirginleşen şişlik ve ağrı ile geliyor. “Çabuk halledelim, işe dönmem lazım” diyor.',facts:{complaint:'Sol alt çene-yüz bölgesinde şişlik ve ağrı',pain:'Ağrı son 24 saatte belirgin artmış',redflag:'Yutkunurken zorlanma hissi ve halsizlik tarifliyor',meds:'Düzenli antihipertansif kullanıyor',allergy:'Penisiline karşı döküntü öyküsü olduğunu söylüyor',history:'Hipertansiyon öyküsü var',pressure:'İş nedeniyle görüşmeyi hızlandırmak istiyor'}}};
const STEPS_ECE=[
{key:'open',title:'Karşılama ve rol',patient:'“Merhaba… dişim çok ağrıyor. Bir de açık söyleyeyim, iğneden çok korkuyorum.”',body:'Omuzları gergin, koltuğa oturmadan önce etrafı süzüyor.',opts:[['Kendimi tanıtıp intörn olduğumu, sorumlu hekimle birlikte çalıştığımı açıklamak; önce onu en çok rahatsız eden şeyi sormak.','good','Rol açıklama + açık uçlu başlangıç','Güven ve işbirliği kurar; hastanın önceliğini erkenden duymanızı sağlar.'],['“Merak etmeyin, kesinlikle hiç acımayacak.” demek ve doğrudan muayeneye geçmek.','bad','Aşırı güvence','Sonucu garanti etmek gerçekçi değildir; önceki kötü deneyimi küçümsenmiş hissettirebilir.'],['“Korkacak bir şey yok, çok kısa sürecek.” deyip anamnezi hızla başlatmak.','warn','Duyguyu kapatma','Süreyi yönetir ama kaygıyı yeterince tanımadan kapatabilir.']]},
{key:'fear',title:'Kaygıyı anlamak',patient:'“Geçen sefer iğneyi görünce panikledim. Bir anda başlayacakmış gibi geliyor.”',body:'Ellerini birbirine kenetliyor.',opts:[['“En çok hangi anda zorlandığınızı anlamak istiyorum. İsterseniz dur işareti belirleyebilir, her adımı başlamadan önce söyleyebiliriz.”','good','Kontrol paylaşımı','Kaygının kaynağını açar ve hastaya görüşme üzerinde kontrol hissi verir.'],['“İğne zaten birkaç saniye, düşünmezseniz geçer.”','warn','Normalleştirme ama küçümseme riski','Niyeti rahatlatmaktır; ancak korkunun şiddetini küçümseyebilir.'],['Enjeksiyon tekniğinin tüm anatomik ayrıntılarını açıklamak.','bad','Aşırı teknik bilgi','Hasta henüz ayrıntı istememişken bilgi yükü kaygıyı artırabilir.']]},
{key:'history',title:'Ağrı anamnezi',patient:'“İki gündür var. Soğuk değince fena oluyor, geceleri de uyandırdı.”',body:'Ağrıyı sağ alt arka bölgeyi göstererek tarif ediyor.',opts:[['Başlangıç, yer, karakter, tetikleyici, gece ağrısı ve ağrı kesici yanıtını sırayla netleştirmek.','good','Yapılandırılmış ağrı öyküsü','Tanısal değerlendirme için gerekli bilgileri sistematik toplar.'],['“Yani sinire ulaşmış gibi, doğru mu?” diye sormak.','bad','Yönlendirici soru','Hastaya tanısal bir yorum yükler ve öykünün doğal akışını bozar.'],['Sadece “kaç gündür ağrıyor?” diye sorup sonraki aşamaya geçmek.','warn','Eksik derinlik','Süreyi öğrenir ancak ağrının niteliği ve tetikleyicileri eksik kalır.']]},
{key:'meds',title:'Tıbbi öykü, ilaç ve alerji',patient:'“Düzenli ilaç kullanmıyorum. Bugün parasetamol aldım. Bildiğim ilaç ya da lateks alerjim yok.”',body:'Bu bölümde sakinleşmiş görünüyor.',opts:[['Sistemik hastalıkları, düzenli ilaçları, bugün aldığı ilaçları ve ilaç/lateks alerjisini ayrı ayrı sorgulamak.','good','Güvenlik taraması','İşlem öncesi temel güvenlik bilgilerini tamamlar; alerji “sorulmadı” ile “yok” karışmaz.'],['“Herhangi bir sağlık probleminiz yok değil mi?” diye tek soruyla geçmek.','warn','Toplu ve yönlendirici tarama','Bazı bilgiler kaçabilir; hasta neyin önemli olduğunu bilmeyebilir.'],['Alerjiyi sormadan sadece düzenli ilaçları öğrenmek.','bad','Kritik eksik','İlaç öyküsü alınsa bile alerji ayrıca sorgulanmalıdır.']]},
{key:'explain',title:'Açıklama ve beklenti yönetimi',patient:'“Peki bugün ne olacak? Antibiyotik verirseniz ağrı geçer mi?”',body:'Cevabınızı dikkatle bekliyor.',opts:[['Önce muayene ve gerekli testlerle nedeni değerlendireceğinizi; antibiyotiğin her diş ağrısında gerekli olmadığını, kararın bulgulara göre verileceğini sade dille anlatmak.','good','Belirsizliği dürüstçe yönetme','Tanı koymadan süreç açıklanır, gereksiz antibiyotik beklentisi dengelenir.'],['“Kesin kanal tedavisi olacaksınız.” demek.','bad','Erken kesinlik','Muayene ve test olmadan kesin tedavi kararı verilmemelidir.'],['Tüm olası endodontik prosedürleri uzun uzun anlatmak.','warn','Bilgi yükü','Doğru bilgiler bile hastanın o anda ihtiyaç duyduğundan fazla olabilir.']]},
{key:'consent',title:'Muayene izni ve kontrol',patient:'“Muayene edebilirsiniz ama bir şey yapmadan önce bana söyleyin.”',body:'Gerginliği azalmış; hâlâ temkinli.',opts:[['Muayenenin kapsamını kısaca açıklayıp izin istemek; işlem gerekecekse ayrıca konuşacağınızı ve istediği anda durabileceğinizi belirtmek.','good','Aşamalı onam','Muayene iznini tedavi onamından ayırır ve hastanın kontrolünü korur.'],['“Zaten buraya geldiyseniz muayeneyi kabul etmiş sayılırsınız.”','bad','Örtük onam varsayımı','Açık iletişim ve hastanın karar alanı zedelenir.'],['“Tamam, hemen başlayalım.” demek.','warn','Eksik onam dili','Hasta izin vermiş olsa da kapsamı ve durma hakkını netleştirmek daha güvenlidir.']]}
];
const STEPS_MURAT=[
{key:'open',title:'Karşılama ve hızlı önceliklendirme',patient:'“Sol tarafım şişti. Çok vaktim yok, birazdan işe dönmem lazım.”',body:'Yüzde asimetri fark ediliyor; konuşurken rahatsız.',opts:[['Kısaca rolümü açıklayıp “Önce güvenliğiniz için şişlikle ilgili birkaç acil soru soracağım” demek.','good','Önceliklendirme','Zaman baskısını kabul ederken güvenlik taramasını öne alır.'],['İş programını ayrıntılı konuşup klinik öyküyü sonra almak.','bad','Yanlış öncelik','Belirgin şişlikte önce klinik güvenlik değerlendirilmelidir.'],['Doğrudan antibiyotik yazılması gerektiğini söylemek.','bad','Muayenesiz tedavi varsayımı','Önce değerlendirme ve uygun klinik karar gerekir.']]},
{key:'redflag',title:'Kırmızı bayraklar',patient:'“Yutkunurken biraz zorlanıyorum, halsizim de.”',body:'Cümle aralarında yutkunuyor.',opts:[['Yutma/solunum güçlüğü, ateş, hızlı yayılım gibi bulguları netleştirip sorumlu hekimi hemen çağırmak.','good','Erken eskalasyon','Olası yaygın enfeksiyon ve hava yolu riski açısından gecikmeden üst değerlendirme gerekir.'],['“Bunlar diş enfeksiyonunda normaldir” deyip rutin anamneze devam etmek.','bad','Tehlikeli normalleştirme','Kırmızı bayrakların önemini azaltır ve gecikmeye yol açabilir.'],['Önce ayrıntılı sosyal öyküyü bitirmek.','bad','Gecikmiş güvenlik değerlendirmesi','Kritik bulgular varken rutin sıra öncelik değildir.']]},
{key:'allergy',title:'İlaç ve alerji güvenliği',patient:'“Tansiyon ilacı kullanıyorum. Penisilin alınca daha önce döküntü olmuştu.”',body:'Telefonuna bakıp acele ettiğini söylüyor.',opts:[['Kullandığı ilacın adını/dozunu ve penisilin reaksiyonunun ayrıntısını mümkün olduğunca netleştirip sorumlu hekime aktarmak.','good','İlaç güvenliği','Tedavi planı açısından ilgili güvenlik bilgisini doğru şekilde devreder.'],['“Döküntü ciddi alerji sayılmaz” demek.','bad','Alerjiyi küçümseme','Reaksiyon öyküsü ayrıntılandırılmadan önemsiz kabul edilmemelidir.'],['Alerjiyi kaydetmeden sadece tansiyon ilacını not etmek.','bad','Kritik eksik','Antibiyotik tartışması olası bir vakada alerji bilgisi özellikle önemlidir.']]},
{key:'handoff',title:'Hastaya açıklama ve güvenli devir',patient:'“Gerçekten bu kadar acil mi? İş yerine haber vermem gerekecek.”',body:'Aceleci tavrı yerini kaygıya bırakıyor.',opts:[['“Yutma güçlüğü ve artan şişlik nedeniyle sizi bekletmeden sorumlu hekimimizin değerlendirmesini istiyorum; bunun nedeni güvenliğiniz” diye açıklamak.','good','Şeffaf güvenlik iletişimi','Gecikmenin nedenini anlaşılır biçimde açıklar ve güvenli devri destekler.'],['“Kötü olabilir, hemen yatış gerekebilir.” demek.','warn','Gereksiz korkutma','Ciddiyeti aktarır ama değerlendirme yapılmadan sonucu ileri taşır.'],['“İşe gitmeyin.” deyip nedenini açıklamamak.','warn','Talimat ama yetersiz gerekçe','Doğru yönde olsa da hastanın işbirliği için gerekçe gerekir.']]}
];
let state=null,mode='learn';function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">Endodonti · intörn eğitimi</div><h1>Klinik İlk Karşılaşma</h1><p class="lead">Hasta karşılama, anamnez, kaygı ve beklenti yönetimi, güvenlik taraması, açıklama ve onamı ilerlemeli olarak çalışın. Birden fazla yol kabul edilebilir; seçimden sonra ne yaptığınızı ve bunun hastaya etkisini görürsünüz.</p><div class="mode"><button class="btn ${mode==='learn'?'active':''}" onclick="mode='learn';home()">Öğrenme modu</button><button class="btn ${mode==='practice'?'active':''}" onclick="mode='practice';home()">Uygulama modu</button></div></section><div class="grid"><button class="card case" onclick="start('ece')"><span class="tag">Vaka 1</span><h2>Ece · ağrı ve iğne kaygısı</h2><p>Serbest iletişim, kaygıyı tanıma, ağrı anamnezi, ilaç-alerji öyküsü, beklenti yönetimi ve aşamalı onam.</p></button><button class="card case" onclick="start('murat')"><span class="tag">Vaka 2 · güvenlik</span><h2>Murat · yüz şişliği ve zaman baskısı</h2><p>Rutin sırayı bırakıp kırmızı bayrakları fark etme, ilaç-alerji güvenliği ve sorumlu hekime erken devir.</p></button></div>`}
function start(id){state={id,i:0,trust:50,clarity:50,control:50,log:[],finished:false};render()}function current(){return (state.id==='ece'?STEPS_ECE:STEPS_MURAT)[state.i]}function render(){if(state.finished)return result();let c=CASES[state.id],s=current();app.innerHTML=`<div class="scene"><section class="card"><div class="eyebrow">${esc(c.name)} · ${state.i+1}/${state.id==='ece'?STEPS_ECE.length:STEPS_MURAT.length}</div><h2>${esc(s.title)}</h2><p class="small">${esc(c.intro)}</p><div class="patient"><strong>Hasta</strong><q>${esc(s.patient)}</q><div class="body">${esc(s.body)}</div></div><div class="options">${s.opts.map((o,j)=>`<button class="option" onclick="choose(${j})"><span class="letter">${String.fromCharCode(65+j)}</span><span>${esc(o[0])}</span></button>`).join('')}</div><div id="feedback"></div></section><aside class="card side"><h3>Görüşme göstergeleri</h3>${meter('Güven',state.trust)}${meter('Netlik',state.clarity)}${meter('Kontrol',state.control)}<p class="small">Bunlar eğitimsel geri bildirim göstergeleridir; doğrulanmış klinik ölçek değildir.</p><h3 style="margin-top:18px">Kayıt</h3><div class="history">${state.log.length?state.log.map(x=>`<div>${esc(x.title)} · ${x.level==='good'?'uygun':x.level==='warn'?'kısmen uygun':'sorunlu'}</div>`).join(''):'<div>Henüz karar yok.</div>'}</div><div class="toolbar"><button class="btn" onclick="home()">Ana sayfa</button></div></aside></div>`}
function meter(n,v){return `<div class="small"><b>${n}</b> ${v}/100</div><div class="meter"><span style="width:${v}%"></span></div>`}function choose(j){let s=current(),o=s.opts[j];let delta=o[1]==='good'?8:o[1]==='warn'?-2:-9;state.trust=Math.max(0,Math.min(100,state.trust+delta));state.clarity=Math.max(0,Math.min(100,state.clarity+(o[1]==='good'?7:o[1]==='warn'?0:-7)));state.control=Math.max(0,Math.min(100,state.control+(o[1]==='good'?6:o[1]==='warn'?-1:-7)));state.log.push({title:s.title,text:o[0],level:o[1],method:o[2],why:o[3]});document.querySelectorAll('.option').forEach(b=>b.disabled=true);let cls=o[1]==='good'?'feedback':o[1]==='warn'?'feedback warn':'feedback bad';let fb=document.getElementById('feedback');fb.innerHTML=`<div class="${cls}"><b>${o[1]==='good'?'Uygun yaklaşım':o[1]==='warn'?'Kısmen uygun':'Sorunlu yaklaşım'} · ${esc(o[2])}</b>${mode==='learn'?`<p>${esc(o[3])}</p>`:'<p>Hasta tepkisini gözlemleyip devam edin; ayrıntılı gerekçe sonuçta gösterilecek.</p>'}<div class="toolbar"><button class="btn primary" onclick="next()">Devam et →</button></div></div>`}function next(){state.i++;let max=state.id==='ece'?STEPS_ECE.length:STEPS_MURAT.length;if(state.i>=max){state.finished=true;result()}else render()}function result(){let c=CASES[state.id];let good=state.log.filter(x=>x.level==='good').length,warn=state.log.filter(x=>x.level==='warn').length,bad=state.log.filter(x=>x.level==='bad').length;let note=state.id==='ece'?`Hasta: Ece (kurgusal eğitim vakası)\nBaşvuru: ${c.facts.complaint}\nAğrı öyküsü: ${c.facts.pain}\nİlaç: ${c.facts.meds}\nAlerji: ${c.facts.allergy}\nTıbbi öykü: ${c.facts.history}\nKaygı/çekince: ${c.facts.fear}\nBeklenti: ${c.facts.expect}`:`Hasta: Murat (kurgusal eğitim vakası)\nBaşvuru: ${c.facts.complaint}\nSeyir: ${c.facts.pain}\nKırmızı bayrak: ${c.facts.redflag}\nİlaç: ${c.facts.meds}\nAlerji: ${c.facts.allergy}\nTıbbi öykü: ${c.facts.history}\nYönetim: sorumlu hekime acil değerlendirme için devir`;app.innerHTML=`<section class="hero"><div class="eyebrow">Görüşme tamamlandı</div><h1>${esc(c.name)} · değerlendirme</h1><p class="lead">Uygun: <b>${good}</b> · Kısmen uygun: <b>${warn}</b> · Sorunlu: <b>${bad}</b></p><div class="done">Başarı yalnız tedaviye onam almak değildir. Güvenli değerlendirme, hastanın çekincesini anlamak, bilgiyi yeterli düzeyde vermek ve gerektiğinde uygun devri yapmak da başarılı sonlanmadır.</div></section><div class="grid"><section class="card"><h2>Kararların</h2>${state.log.map((x,i)=>`<div class="feedback ${x.level==='warn'?'warn':x.level==='bad'?'bad':''}"><b>${i+1}. ${esc(x.title)} · ${esc(x.method)}</b><p>${esc(x.why)}</p><p class="small">Seçimin: ${esc(x.text)}</p></div>`).join('')}</section><section class="card"><h2>Devir notu</h2><p class="small">Yalnız bu senaryoda açığa çıkan sabit bilgiler kullanılır; gerçek hasta kaydı değildir.</p><div class="report">${esc(note)}</div><div class="toolbar"><button class="btn primary" onclick="copyNote()">Notu kopyala</button><button class="btn" onclick="start('${state.id}')">Vakayı yeniden oyna</button><button class="btn" onclick="home()">Modüllere dön</button></div></section></div>`}async function copyNote(){let t=document.querySelector('.report').innerText;try{await navigator.clipboard.writeText(t);alert('Devir notu kopyalandı.')}catch(e){alert('Tarayıcı kopyalamaya izin vermedi; metni seçerek kopyalayabilirsiniz.')}}home();
</script></body></html>
